name: Manual Cross Platform Tests

on:
  workflow_dispatch:

jobs:
  test:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - windows-latest
          - macos-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Upgrade pip
        run: python -m pip install --upgrade pip

      - name: Install package
        run: |
          pip install -e .

      - name: Verify CLI
        shell: bash
        run: |
          vibe-fw --help

      - name: Download Firmware
        shell: bash
        run: |
          vibe-fw download

      - name: Verify Downloaded Packages
        shell: bash
        run: |
          python - <<'PY'
          from vibe_firmware.paths import AppPaths

          paths = AppPaths()

          downloads = paths.downloads

          print(f"Downloads folder: {downloads}")

          files = list(downloads.glob("*.zip"))

          for file in files:
              print(f"Found: {file.name}")

          assert files, (
              f"No firmware packages downloaded to {downloads}"
          )

          print(f"SUCCESS: {len(files)} package(s) downloaded")
          PY
