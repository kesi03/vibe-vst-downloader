name: Manual Cross Platform Tests

on:
  workflow_dispatch:

jobs:
  test:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - windows-latest
          - macos-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Upgrade pip
        run: python -m pip install --upgrade pip

      - name: Install package
        run: |
          pip install -e .

      - name: Verify CLI
        shell: bash
        run: |
          vibe-fw --help

      - name: Set Download Folder
        shell: bash
        run: |
          case "${{ runner.os }}" in
            Windows)
              echo "DOWNLOADS_DIR=$APPDATA/VIBE FM/Downloads" >> $GITHUB_ENV
              ;;
            macOS)
              echo "DOWNLOADS_DIR=$HOME/Library/Application Support/VIBE FM/Downloads" >> $GITHUB_ENV
              ;;
            Linux)
              echo "DOWNLOADS_DIR=$HOME/.local/share/VIBE FM/Downloads" >> $GITHUB_ENV
              ;;
          esac

      - name: Download Firmware
        shell: bash
        run: |
          vibe-fw download

      - name: Verify Downloads Exist
        shell: bash
        run: |
          echo "Checking: $DOWNLOADS_DIR"

          find "$DOWNLOADS_DIR" -type f

          ZIP_COUNT=$(find "$DOWNLOADS_DIR" -name "*.zip" | wc -l)

          if [ "$ZIP_COUNT" -eq 0 ]; then
            echo "No firmware packages downloaded"
            exit 1
          fi

          echo "Found $ZIP_COUNT downloaded package(s)"
